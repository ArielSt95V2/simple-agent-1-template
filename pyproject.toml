[project]
name = "lan-agent-template"
version = "0.3.0"
description = "LangGraph + LangChain LAN chatbot template with Docker sandbox, RAG, and HTML artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-postgres>=0.0.12",
    "langchain-text-splitters>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.scripts]
lan-agent = "agent.app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
